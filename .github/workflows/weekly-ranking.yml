name: 週次ランキング自動取得

on:
  schedule:
    - cron: '30 4 * * 1'   # 毎週月曜 13:30 (日本時間)
  workflow_dispatch:        # Actions画面の「Run workflow」で手動実行
  push:
    paths:
      - fetch_rankings.py
      - .github/workflows/weekly-ranking.yml

permissions:
  contents: write

concurrency:
  group: ranking-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ランキング取得
        run: python fetch_rankings.py
      - name: GitHubに保存
        if: always()
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add ranking_data.json ranking_data.js
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "媒体ランキング自動取得 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
